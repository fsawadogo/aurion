# =============================================================================
# Marketing site — peritwin.com → AWS Amplify (manual-deploy mode)
# =============================================================================
# Mirrors web.yml's architecture for the public marketing site now that
# its source lives in this monorepo under website/ (moved from the
# separate forwauzz/aurion clone, 2026-07-25). Static Next.js export,
# shipped to the peritwin-marketing Amplify app via the manual-deploy
# API. Auth is the existing OIDC dev deployer role.
#
# The Amplify app id is infrastructure, not a secret — it's created by
# infrastructure/amplify_marketing.tf (`terraform output
# marketing_amplify_app_id`) and pinned here for zero-config deploys.

name: Marketing Site

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-marketing-site
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  AMPLIFY_APP_ID: d2f09rlxv3khqi
  AMPLIFY_BRANCH: main
  NEXT_PUBLIC_SITE_URL: https://peritwin.com
  NEXT_PUBLIC_API_BASE: https://api-dev.aurionclinical.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        run: cd website && pnpm install --frozen-lockfile

      - name: Build static export
        run: cd website && pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Amplify
        run: |
          set -euo pipefail
          (cd website/out && zip -qr ../out.zip .)

          RESP=$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --output json)
          ZIP_URL=$(echo "$RESP" | jq -r '.zipUploadUrl')
          JOB_ID=$(echo "$RESP" | jq -r '.jobId')

          curl -sf -X PUT -H 'Content-Type: application/zip' \
            --upload-file website/out.zip "$ZIP_URL"

          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$JOB_ID" >/dev/null

          for i in $(seq 1 30); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' --output text)
            echo "job $JOB_ID: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Amplify job" >&2
          exit 1
